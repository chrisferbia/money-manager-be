[project]
name = "money-manager-be"
version = "0.1.0"
description = "Python money manager worker"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "jinja2",
    "python-multipart",
]

[dependency-groups]
dev = [
    "workers-py",
    "workers-runtime-sdk",
    "pytest",
    "requests",
    "httpx2",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not worker'"
pythonpath = ["src"]
markers = [
    "integration: tests that start the Worker and use local D1",
    "unit: fast tests that do not require the Worker or D1",
    "worker: smoke tests against the real PyWrangler Worker runtime",
]
